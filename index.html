<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>血月之约</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; background: #07030a; }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; pointer-events: none;
    color: #f3dce4; font: 16px "Microsoft YaHei", sans-serif; letter-spacing: 2px;
  }
  #boot b { color: #ff5577; font-size: 28px; letter-spacing: 8px; font-weight: 600; }
  #boot span { color: #8d7188; font-size: 12px; letter-spacing: 1px; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<div id="boot"><b>血 月 之 约</b><span>加载中…（首次进入需下载素材，点击画面播放音乐）</span></div>
<audio id="bgm-ending" src="assets/audio/bgm_ending.mp3" loop preload="auto"></audio>
<script>
(() => {
  const el = document.getElementById('bgm-ending');
  if (!el) return;
  let muted = false;
  try { muted = localStorage.getItem('bmp_mute') === '1'; } catch (e) { /* ignore */ }
  if (muted) return;
  el.volume = 0.3;
  const start = () => { const p = el.play(); if (p) p.catch(() => {}); };
  const p = el.play();
  if (p) {
    p.catch(() => {
      window.addEventListener('pointerdown', start, { once: true });
      window.addEventListener('keydown', start, { once: true });
    });
  }
})();
</script>
<script charset="utf-8" src="src/util.js"></script>
<script charset="utf-8" src="assets/sprites/frames/manifest.js"></script>
<script charset="utf-8" src="assets/sprites/frames/boss/manifest.js"></script>
<script charset="utf-8" src="src/story.js"></script>
<script charset="utf-8" src="src/input.js"></script>
<script charset="utf-8" src="src/assets.js"></script>
<script charset="utf-8" src="src/fx.js"></script>
<script charset="utf-8" src="src/audio.js"></script>
<script charset="utf-8" src="src/level.js"></script>
<script charset="utf-8" src="src/dummy.js"></script>
<script charset="utf-8" src="src/enemies.js"></script>
<script charset="utf-8" src="src/boss.js"></script>
<script charset="utf-8" src="src/player.js"></script>
<script charset="utf-8" src="src/dialogue.js"></script>
<script charset="utf-8" src="src/collect.js"></script>
<script charset="utf-8" src="src/gallery.js"></script>
<script charset="utf-8" src="src/hud.js"></script>
<script charset="utf-8" src="src/main.js"></script>
</body>
</html>
